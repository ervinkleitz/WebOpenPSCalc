# Weekly check that our item data still matches Payon Stories.
#
# ps_item_db.json carries no stats and is a point-in-time scrape, so every number we
# serve comes from the vanilla pre-renewal record. A PS rework is therefore invisible
# until a player reports it — that is how the Wrench (1531) served vanilla's item for
# six months. This job asks the live PS item API instead of waiting.
#
# It is deliberately NOT part of deploy.yml: it talks to a third party, it can fail
# for reasons that have nothing to do with the commit, and it must never block a push.
#
# The job fails only on findings that are NOT in ps_item_audit_baseline.json, so it
# stays quiet until Payon Stories actually changes something. After reviewing a real
# finding, run `npm run ps:audit-items:accept` and commit the baseline.
name: PS item audit

on:
  schedule:
    # Mondays, 04:00 UTC. Weekly rather than daily: ~2,755 requests at 4 in flight is
    # a couple of minutes against someone else's server, and PS does not rework items
    # daily. Bump it down if that ever stops being true.
    - cron: "0 4 * * 1"
  workflow_dispatch: {}

# Never pile runs on top of each other if one is slow.
concurrency:
  group: ps-item-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install backend deps
        working-directory: open-ps-calc-backend/backend
        run: npm ci

      - name: Compare our item data against the live PS API
        id: audit
        working-directory: open-ps-calc-backend/backend
        run: npm run ps:audit-items

      # Keep the report even when the step above failed — that is the run you want to read.
      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ps-item-audit-report
          path: open-ps-calc-backend/backend/scripts/ps-item-audit-report.json
          if-no-files-found: warn
          retention-days: 30
