name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Backend install + typecheck + tests
        working-directory: open-ps-calc-backend/backend
        run: |
          npm ci
          npx tsc --noEmit
          npm test

      - name: Frontend install + typecheck + build
        working-directory: open-ps-calc-frontend/frontend
        run: |
          npm ci
          npx tsc --noEmit
          npm run build

  deploy:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Build frontend
        working-directory: open-ps-calc-frontend/frontend
        env:
          VITE_API_KEY: ${{ secrets.API_KEY }}
        run: |
          npm ci
          npm run build

      - name: Set up SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.EC2_SSH_KEY }}

      - name: Trust EC2 host key
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Ensure deploy directories exist
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "mkdir -p ${{ secrets.EC2_DEPLOY_PATH }}/backend ${{ secrets.EC2_DEPLOY_PATH }}/frontend/dist"

      - name: Sync backend source
        run: |
          rsync -az --delete \
            --exclude 'node_modules' \
            --exclude '.git' \
            --exclude '.env' \
            open-ps-calc-backend/backend/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}/backend/"

      - name: Sync frontend build
        run: |
          rsync -az --delete \
            open-ps-calc-frontend/frontend/dist/ \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}/frontend/dist/"

      - name: Sync pm2 ecosystem config
        run: |
          rsync -az \
            deploy/ecosystem.config.js \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ secrets.EC2_DEPLOY_PATH }}/ecosystem.config.js"

      # API_KEY is written here, from the same secret the frontend build above
      # bakes in as VITE_API_KEY, so the two halves cannot drift apart. They
      # had: the backend was never given the value at all, so its gate
      # self-disabled (`if (!API_KEY) return next()`) and every /api/* route
      # answered unauthenticated callers, while the frontend shipped a key the
      # server never checked. The box's .env used to be the source of truth,
      # kept in step with the secret BY HAND — which is the drift that caused
      # it. One value, one place, injected on every deploy.
      - name: Write secrets to server .env
        env:
          STATS_PASSWORD: ${{ secrets.STATS_PASSWORD }}
          API_KEY: ${{ secrets.API_KEY }}
        run: |
          printf '%s\n%s\n' "$STATS_PASSWORD" "$API_KEY" | ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "read -r stats
             read -r apikey
             ENVFILE='${{ secrets.EC2_DEPLOY_PATH }}/backend/.env'
             grep -v -e '^STATS_PASSWORD=' -e '^API_KEY=' \"\$ENVFILE\" > \"\$ENVFILE.tmp\" 2>/dev/null || true
             printf 'STATS_PASSWORD=%s\n' \"\$stats\" >> \"\$ENVFILE.tmp\"
             printf 'API_KEY=%s\n' \"\$apikey\" >> \"\$ENVFILE.tmp\"
             mv \"\$ENVFILE.tmp\" \"\$ENVFILE\""

      - name: Patch nginx config
        run: |
          rsync -az deploy/patch-nginx.sh \
            "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:/tmp/patch-nginx.sh"
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" \
            "bash /tmp/patch-nginx.sh"

      - name: Install backend deps & restart via pm2
        run: |
          ssh "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" 'bash -s' -- "${{ secrets.EC2_DEPLOY_PATH }}" < deploy/remote-deploy.sh
